[project]
name = "deploy-talos-proxmox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex DeAraujo", email = "adearaujo@kentik.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44.0",
    "proxmoxer>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[project.scripts]
deploy-talos = "deploy_talos_proxmox:main"
deploy-kagent = "deploy_talos_proxmox.deploy_kagent:main"

[tool.pytest.ini_options]
# tools/ holds repo tooling that is not part of the shipped package.
pythonpath = ["tools"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
